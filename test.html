<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогрессика</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --text: #333333;
            --card-bg: #ffffff;
            --border: #e0e6ed;
            --radius: 16px;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        .watermark-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .watermark {
            position: absolute;
            font-weight: bold;
            color: rgba(74, 144, 226, 0.08);
            user-select: none;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0.08;
            will-change: transform, opacity;
            animation: floatSmooth 18s ease-in-out infinite alternate;
        }

        .watermark-icon {
            width: 1em;
            height: 1em;
            border-radius: 50%;
            object-fit: cover;
        }

        @keyframes floatSmooth {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 0.04;
            }
            50% {
                transform: translate(30px, -40px) scale(1.05) rotate(5deg);
                opacity: 0.12;
            }
            100% {
                transform: translate(-20px, -80px) scale(0.98) rotate(-5deg);
                opacity: 0.05;
            }
        }

        .container {
            max-width: 800px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 32px;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0px;
        }
        
        .header-logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: -1px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        h2 { margin-top: 0; font-size: 20px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }

        .task-list { display: flex; flex-direction: column; gap: 20px; }
        
        .task-item {
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fafbfc;
        }

        .task-text { font-size: 16px; margin-bottom: 15px; line-height: 1.5; }

        input[type="number"] {
            width: 150px;
            padding: 10px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border 0.2s;
        }

        input[type="number"]:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }

        button:hover { background: var(--primary-hover); }

        .builder-controls { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-bottom: 15px;
        }
        
        @media (max-width: 600px) {
            .builder-controls { grid-template-columns: 1fr; }
        }

        .builder-controls label { display: flex; align-items: center; font-size: 14px; }
        .builder-controls input[type="number"] { width: 50px; margin-right: 10px; padding: 5px; }
        
        .link-output {
            margin-top: 20px;
            padding: 15px;
            background: #eef5fb;
            border-left: 4px solid var(--primary);
            word-break: break-all;
            font-family: monospace;
            font-size: 14px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border); }
        th { background: #f8f9fa; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="watermark-layer" id="watermark-layer"></div>

<div class="container">
    <div class="header">
        <h1>
            <svg class="header-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="50" fill="#2B72FF"/>
                <path d="M 27 78 V 40 C 27 27, 73 27, 73 40 V 78" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                <path d="M 77 22 L 79 26 L 83 28 L 79 30 L 77 34 L 75 30 L 71 28 L 75 26 Z" fill="#FFFFFF"/>
                <path d="M 82 31 L 83 33 L 85 34 L 83 35 L 82 37 L 81 35 L 79 34 L 81 33 Z" fill="#FFFFFF"/>
            </svg>
            рогрессика
        </h1>
        <p id="subtitle">Математика — это просто!</p>
    </div>

    <div id="teacher-view" class="card hidden">
        <h2>Конструктор варианта</h2>
        <div class="builder-controls" id="builder-controls"></div>
        <button onclick="generateVariant()" style="margin-top: 15px;">Создать ссылку и ключи</button>

        <div id="teacher-output" class="hidden">
            <div class="link-output" id="generated-link"></div>
            <h3>Ключи к варианту:</h3>
            <table>
                <thead><tr><th>№</th><th>Правильный ответ</th></tr></thead>
                <tbody id="keys-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="student-view" class="card hidden">
        <div class="task-list" id="student-tasks"></div>
        <button onclick="finishTest()" style="margin-top: 25px;">Завершить и посмотреть итог</button>
    </div>

    <div id="result-view" class="card hidden">
        <h2>Твои ответы</h2>
        <p>Сделай скриншот этой таблицы и отправь преподавателю 🦊</p>
        <table>
            <thead><tr><th>№ задачи</th><th>Твой ответ</th></tr></thead>
            <tbody id="results-table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const LOGO_SVG = `<svg class="watermark-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="50" fill="#2B72FF"/><path d="M 27 78 V 40 C 27 27, 73 27, 73 40 V 78" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M 77 22 L 79 26 L 83 28 L 79 30 L 77 34 L 75 30 L 71 28 L 75 26 Z" fill="#FFFFFF"/><path d="M 82 31 L 83 33 L 85 34 L 83 35 L 82 37 L 81 35 L 79 34 L 81 33 Z" fill="#FFFFFF"/></svg>`;

    function initWatermarks() {
        const layer = document.getElementById('watermark-layer');
        const count = 6;
        for (let i = 0; i < count; i++) {
            const wm = document.createElement('div');
            wm.className = 'watermark';
            wm.innerHTML = `${LOGO_SVG} ⭐`;
            
            wm.style.top = `${25 + Math.random() * 60}%`;
            wm.style.left = `${Math.random() * 80}%`;
            wm.style.fontSize = `${Math.floor(Math.random() * 25) + 35}px`;
            wm.style.animationDuration = `${14 + Math.random() * 10}s`;
            wm.style.animationDelay = `${(i * -2.5).toFixed(1)}s`;
            layer.appendChild(wm);
        }
    }
    initWatermarks();

    let protectClose = false;
    window.addEventListener('beforeunload', (e) => {
        if (protectClose) {
            e.preventDefault();
            e.returnValue = '';
        }
    });

    let currentSeed = 0;
    function setSeed(seed) { currentSeed = seed; }
    
    function seededRandom() {
        let t = currentSeed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }

    function getRandomInt(min, max) {
        return Math.floor(seededRandom() * (max - min + 1)) + min;
    }

    function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

    const taskLibrary = {
        add: {
            title: "Сложение (многозначные)",
            generate: () => {
                const a = getRandomInt(1000, 9999);
                const b = getRandomInt(1000, 9999);
                return { text: `Вычисли сумму: ${a} + ${b}`, answer: a + b };
            }
        },
        sub: {
            title: "Вычитание (многозначные)",
            generate: () => {
                const a = getRandomInt(5000, 9999);
                const b = getRandomInt(1000, 4999);
                return { text: `Вычисли разность: ${a} - ${b}`, answer: a - b };
            }
        },
        mult: {
            title: "Умножение (в столбик)",
            generate: () => {
                const a = getRandomInt(100, 999);
                const b = getRandomInt(10, 99);
                return { text: `Вычисли произведение: ${a} × ${b}`, answer: a * b };
            }
        },
        div: {
            title: "Деление (без остатка)",
            generate: () => {
                const b = getRandomInt(11, 99);
                const c = getRandomInt(20, 99);
                const a = b * c;
                return { text: `Выполни деление: ${a} : ${b}`, answer: c };
            }
        },
        div_rem: {
            title: "Деление (найти остаток)",
            generate: () => {
                const b = getRandomInt(10, 30);
                const c = getRandomInt(10, 50);
                const r = getRandomInt(1, b - 1);
                const a = b * c + r;
                return { text: `Найди остаток от деления ${a} на ${b}`, answer: r };
            }
        },
        order_ops: {
            title: "Порядок действий",
            generate: () => {
                const a = getRandomInt(10, 50);
                const b = getRandomInt(5, 15);
                const c = getRandomInt(2, 9);
                const answer = a - (b * c);
                return { text: `Вычисли: ${a} - ${b} × ${c}`, answer: answer };
            }
        },
        nod: {
            title: "НОД (5-6 класс)",
            generate: () => {
                const common = getRandomInt(2, 12);
                let x = getRandomInt(2, 9);
                let y = getRandomInt(2, 9);
                while (gcd(x, y) !== 1 || x === y) {
                    x = getRandomInt(2, 9);
                    y = getRandomInt(2, 9);
                }
                return { text: `Найди НОД чисел ${common * x} и ${common * y}`, answer: common };
            }
        },
        nok: {
            title: "НОК (5-6 класс)",
            generate: () => {
                const common = getRandomInt(2, 5);
                let x = getRandomInt(2, 5);
                let y = getRandomInt(2, 5);
                while (gcd(x, y) !== 1 || x === y) {
                    x = getRandomInt(2, 5);
                    y = getRandomInt(2, 5);
                }
                const a = common * x;
                const b = common * y;
                const answer = (a * b) / gcd(a, b);
                return { text: `Найди НОК чисел ${a} и ${b}`, answer: answer };
            }
        },
        fract_part: {
            title: "Нахождение части от числа",
            generate: () => {
                const den = getRandomInt(3, 10);
                const num = getRandomInt(1, den - 1);
                const mult = getRandomInt(5, 20);
                const total = den * mult;
                return { text: `Найди ${num}/${den} от числа ${total}`, answer: num * mult };
            }
        },
        dec_add: {
            title: "Сложение десятичных",
            generate: () => {
                const a = getRandomInt(10, 99) / 10;
                const b = getRandomInt(100, 999) / 100;
                const ans = Math.round((a + b) * 100) / 100; 
                return { text: `Вычисли: ${a} + ${b} (ответ запиши десятичной дробью, используй точку)`, answer: ans };
            }
        },
        percent: {
            title: "Нахождение процента",
            generate: () => {
                const p = getRandomInt(1, 9) * 10;
                const total = getRandomInt(5, 50) * 10;
                return { text: `Найди ${p}% от числа ${total}`, answer: (p * total) / 100 };
            }
        },
        neg_add: {
            title: "Отрицательные числа (сложение)",
            generate: () => {
                const a = -getRandomInt(15, 50);
                const b = getRandomInt(5, 40);
                return { text: `Вычисли: ${a} + ${b}`, answer: a + b };
            }
        },
        eq_complex: {
            title: "Уравнение со скобками",
            generate: () => {
                const x = getRandomInt(2, 10);
                const b = getRandomInt(1, 10);
                const a = getRandomInt(2, 6);
                const c = a * (x + b);
                return { text: `Реши уравнение: ${a} × (x + ${b}) = ${c}. Чему равен x?`, answer: x };
            }
        },
        motion_meet: {
            title: "Движение (навстречу)",
            generate: () => {
                const v1 = getRandomInt(40, 80);
                const v2 = getRandomInt(40, 80);
                const t = getRandomInt(2, 5);
                const s = (v1 + v2) * t;
                return { text: `Два автомобиля выехали навстречу друг другу. Скорость первого ${v1} км/ч, второго ${v2} км/ч. Расстояние между городами ${s} км. Через сколько часов они встретятся?`, answer: t };
            }
        },
        geom_area: {
            title: "Площадь прямоугольника",
            generate: () => {
                const a = getRandomInt(12, 30);
                const b = getRandomInt(5, 15);
                return { text: `Длина прямоугольника ${a} см, а ширина ${b} см. Найди площадь (в кв. см).`, answer: a * b };
            }
        },
        geom_cube: {
            title: "Объем куба",
            generate: () => {
                const a = getRandomInt(3, 9);
                return { text: `Ребро куба равно ${a} см. Найди его объем (в куб. см).`, answer: a * a * a };
            }
        },
        mean: {
            title: "Среднее арифметическое",
            generate: () => {
                const a = getRandomInt(10, 30);
                const b = getRandomInt(10, 30);
                const c = getRandomInt(10, 30);
                const rem = (a + b + c) % 4;
                const d = getRandomInt(5, 15) * 4 + (4 - rem) % 4;
                const sum = a + b + c + d;
                return { text: `Найди среднее арифметическое чисел: ${a}, ${b}, ${c}, ${d}`, answer: sum / 4 };
            }
        }
    };

    function checkRoute() {
        const hash = window.location.hash;
        
        document.getElementById('teacher-view').classList.add('hidden');
        document.getElementById('student-view').classList.add('hidden');
        document.getElementById('result-view').classList.add('hidden');

        if (hash.startsWith('#t=')) {
            const variantData = hash.substring(3).trim(); 
            initStudentView(variantData);
        } else {
            protectClose = false; 
            initTeacherView();
        }
    }

    function initTeacherView() {
        document.getElementById('teacher-view').classList.remove('hidden');
        document.getElementById('subtitle').innerText = "Конструктор заданий";
        
        const controls = document.getElementById('builder-controls');
        controls.innerHTML = '';
        for (const [key, task] of Object.entries(taskLibrary)) {
            controls.innerHTML += `
                <label>
                    <input type="number" id="count-${key}" min="0" max="10" value="0"> 
                    ${task.title}
                </label>`;
        }
    }

    function generateVariant() {
        let selectedTypes = [];
        for (const key of Object.keys(taskLibrary)) {
            const count = parseInt(document.getElementById(`count-${key}`).value) || 0;
            for (let i = 0; i < count; i++) selectedTypes.push(key);
        }

        if (selectedTypes.length === 0) {
            alert("Выбери хотя бы одну задачу!");
            return;
        }

        const seed = Math.floor(100000 + Math.random() * 900000);
        const urlStr = `${seed}-${selectedTypes.join('-')}`;
        const link = `${window.location.origin}${window.location.pathname}#t=${urlStr}`;
        
        document.getElementById('generated-link').innerHTML = `<a href="${link}" target="_blank">${link}</a>`;
        
        setSeed(seed);
        const tbody = document.getElementById('keys-table-body');
        tbody.innerHTML = '';
        
        selectedTypes.forEach((type, index) => {
            const task = taskLibrary[type].generate(); 
            tbody.innerHTML += `<tr><td>№ ${index + 1}</td><td><b>${task.answer}</b></td></tr>`;
        });

        document.getElementById('teacher-output').classList.remove('hidden');
    }

    let studentTasksData = [];

    function initStudentView(data) {
        document.getElementById('student-view').classList.remove('hidden');
        document.getElementById('subtitle').innerText = "Реши задачи и отправь результаты";
        
        protectClose = true;
        
        const parts = data.split('-').map(item => item.trim()).filter(item => item !== '');
        const seed = parseInt(parts.shift()); 
        const types = parts; 

        setSeed(seed); 
        
        const taskContainer = document.getElementById('student-tasks');
        taskContainer.innerHTML = ''; 
        studentTasksData = [];
        
        types.forEach((type, index) => {
            if (taskLibrary[type]) {
                const task = taskLibrary[type].generate(); 
                studentTasksData.push(task); 
                
                taskContainer.innerHTML += `
                    <div class="task-item">
                        <div style="font-weight: bold; color: #888; margin-bottom: 5px;">Задача ${index + 1}</div>
                        <div class="task-text">${task.text}</div>
                        <input type="number" step="any" id="answer-${index}" placeholder="Твой ответ...">
                    </div>
                `;
            }
        });

        if (studentTasksData.length === 0) {
            taskContainer.innerHTML = `<p style="color: red;">Ошибка загрузки. Проверь правильность ссылки!</p>`;
        }
    }

    function finishTest() {
        document.getElementById('student-view').classList.add('hidden');
        document.getElementById('result-view').classList.remove('hidden');
        
        protectClose = true; 
        
        const tbody = document.getElementById('results-table-body');
        tbody.innerHTML = '';
        
        studentTasksData.forEach((task, index) => {
            const studentAnswer = document.getElementById(`answer-${index}`).value || "Нет ответа";
            tbody.innerHTML += `
                <tr>
                    <td>№ ${index + 1}</t
